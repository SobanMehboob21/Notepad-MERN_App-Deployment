name: MERN Stack DevOps Production Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-ship-mern-app:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build & Push MERN Backend Container
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: soban11776/notepad-backend:latest

    - name: Build & Push MERN Frontend Container
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: soban11776/notepad-frontend:latest
