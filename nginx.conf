proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

upstream backend_servers {
    least_conn; 
    server notepad-backend:5000; # Matches container name and internal port
}

server {
    listen 80;
    server_name 3.88.199.167;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Frontend Assets Routing & Caching
    location / {
        proxy_pass http://notepad-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        proxy_cache my_cache;
        proxy_cache_valid 200 10m;
        add_header X-Proxy-Cache $upstream_cache_status;
    }

    # Backend API Routing (Handles traffic from VITE_API_URL)
    location /api/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_off;
    }
}
