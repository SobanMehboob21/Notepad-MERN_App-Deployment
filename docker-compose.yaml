version: "3.9"

services:
  # 1. New Nginx Service (The Only Entrypoint)
  nginx:
    image: nginx:alpine
    container_name: mern-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: notepad-mongo
    restart: unless-stopped
    # Remove ports block later if you want total lock down.
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: notepad-backend
    restart: unless-stopped
    # CHANGED: Changed 'ports' to 'expose' so it stays private
    expose:
      - "5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/notepad
    volumes:
      - ./backend:/app       
      - /app/node_modules  
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: notepad-frontend
    restart: unless-stopped
    # CHANGED: Changed 'ports' to 'expose' so it stays private
    expose:
      - "5173"
    environment:
      # CRITICAL CHANGE: Tells your frontend to talk to your EC2 Public IP / Domain via Nginx
      VITE_API_URL: http://3.88.199
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
  nginx-cache: # New volume for Nginx micro-caching
